shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
catalogs:
  cli:
    dotenv: ^17.3.1
    to-ico: ^1.1.5
    tsx: ^4.21.0

  lint:
    '@antfu/eslint-config': ^7.7.2
    '@nuxt/eslint': ^1.15.2
    '@typescript-eslint/parser': ^8.57.0
    eslint: ^10.0.3

  nuxt:
    '@nuxt/content': ^3.12.0
    '@nuxt/fonts': 0.14.0
    '@nuxtjs/color-mode': ^4.0.0
    '@unocss/nuxt': ^66.6.6
    '@vueuse/nuxt': ^14.2.1
    better-sqlite3: ^12.8.0
    nuxt: ^4.4.2
    vue-router: ^5.0.3

  types:
    '@types/node': ^25.5.0
    '@types/to-ico': ^1.1.3
    typescript: ^5.9.3
    vue-tsc: ^3.2.5

  website:
    '@iconify-json/ph': ^1.2.2
    '@vueuse/core': ^14.2.1
    remark-breaks: ^4.0.0
    unocss: ^66.6.6

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - eslint
  - sqlite3
  - unrs-resolver
