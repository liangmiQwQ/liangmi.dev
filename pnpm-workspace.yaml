shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
catalog:
  '@liangmi/vp-config': 1.0.0
  vite-plus: 1.3.0
  '@iconify-json/streamline-cyber': ^1.2.2
  marked: ^18.0.10
  sharp: ^0.35.2
catalogs:
  cli:
    dotenv: ^17.4.2
    to-ico: ^1.1.5
    tsx: ^4.23.12

  types:
    '@types/node': ^26.2.0
    '@types/to-ico': ^1.1.3
    typescript: ^6.0.3
    vue-tsc: ^3.3.11

  void:
    '@void/md': ^1.2.1
    '@void/vue': ^1.2.1
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    void: ^1.2.1
    vue: ^3.5.41
    wrangler: ^4.152.0

  website:
    '@iconify-json/ph': ^1.2.2
    '@vueuse/core': ^14.4.0
    motion-v: ^2.4.0
    unocss: ^66.8.1

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sqlite3
  - unrs-resolver
  - workerd

peerDependencyRules:
  allowAny:
    - vite
    - vitest

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
