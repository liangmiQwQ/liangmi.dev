shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
catalog:
  '@iconify-json/streamline-cyber': ^1.2.2
  marked: ^15.0.12
catalogs:
  cli:
    dotenv: ^17.4.2
    to-ico: ^1.1.5
    tsx: ^4.21.0

  lint:
    '@antfu/eslint-config': ^8.2.0
    '@typescript-eslint/parser': ^8.58.2
    eslint: ^10.2.0

  types:
    '@types/node': ^25.6.0
    '@types/to-ico': ^1.1.3
    typescript: ^6.0.2
    vue-tsc: ^3.2.6

  void:
    '@void/md': ^0.8.11
    '@void/vue': ^0.8.11
    vite: ^8.0.14
    void: ^0.8.11
    vue: ^3.5.34

  website:
    '@iconify-json/ph': ^1.2.2
    '@vueuse/core': ^14.2.1
    motion-v: ^2.2.1
    unocss: ^66.6.8

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - eslint
  - sqlite3
  - unrs-resolver
  - workerd

peerDependencyRules:
  allowAny:
    - vite
    - vitest
