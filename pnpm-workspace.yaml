shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar

catalogs:
  cli:
    dotenv: ^17.3.1
    to-ico: ^1.1.5
    tsx: ^4.21.0

  lint:
    '@antfu/eslint-config': ^7.6.1
    '@nuxt/eslint': ^1.15.2
    '@typescript-eslint/parser': ^8.56.1
    eslint: ^10.0.2

  nuxt:
    '@nuxt/content': ^3.12.0
    '@nuxtjs/color-mode': ^4.0.0
    '@unocss/nuxt': ^66.6.2
    '@vueuse/nuxt': ^14.2.1
    better-sqlite3: ^12.6.2
    nuxt: ^4.3.1

  types:
    '@types/node': ^25.3.3
    '@types/to-ico': ^1.1.3
    typescript: ^5.9.3
    vue-tsc: ^3.2.5

  website:
    '@iconify-json/ph': ^1.2.2
    '@iconify/json': ^2.2.444
    '@vueuse/core': ^14.2.1
    remark-breaks: ^4.0.0
    unocss: ^66.6.2

onlyBuiltDependencies:
  - better-sqlite3
  - sqlite3
  - eslint
