name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22
          cache: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
      - run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
